<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fuzzy Logic Sugeno — AI Monster</title>
<style>
  :root {
    --bg: #0d0d1a; --panel: #13132a; --border: #2a2a4a;
    --text: #c8cce0; --dim: #7a7ea0; --accent: #6ec6ff;
    --red: #ff5555; --green: #44dd66; --blue: #44aaff; --orange: #ffaa44;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'Consolas', 'SF Mono', monospace; overflow: hidden; height: 100vh; }

  /* Layout */
  #app { display: grid; grid-template-columns: 1fr 360px; grid-template-rows: 1fr auto; height: 100vh; gap: 0; }
  #app.sidebar-collapsed { grid-template-columns: 1fr 0px; }
  #app.inference-collapsed { grid-template-rows: 1fr 0px; }
  #app.sidebar-collapsed.inference-collapsed { grid-template-rows: 1fr 0px; }
  @media (max-width: 768px) {
    #app { grid-template-columns: 1fr !important; }
    #app.sidebar-collapsed { grid-template-columns: 1fr !important; }
    #sidebar { position: fixed; right: 0; top: 0; bottom: 0; width: 280px; z-index: 50; transform: translateX(0); transition: transform 0.2s; }
    #app.sidebar-collapsed #sidebar { transform: translateX(100%); width: 280px; }
    #toggleSidebar { right: 8px !important; }
  }

  /* Game area */
  #game-wrap { position: relative; overflow: hidden; background: #0a0a1a; }
  #game { display: block; width: 100%; height: 100%; }

  /* Toggle buttons */
  .toggle-btn {
    position: absolute; z-index: 10; background: rgba(19,19,42,0.85); border: 1px solid var(--border);
    color: var(--dim); cursor: pointer; font-size: 11px; font-family: inherit; padding: 3px 8px; border-radius: 3px;
    transition: color 0.15s, border-color 0.15s;
  }
  .toggle-btn:hover { color: var(--accent); border-color: var(--accent); }
  #toggleSidebar { top: 8px; right: 8px; }
  #toggleInference { bottom: 8px; right: 8px; }
  #app.sidebar-collapsed #toggleSidebar { right: 8px; }
  #app:not(.sidebar-collapsed) #toggleSidebar { right: 368px; }

  /* Right sidebar */
  #sidebar {
    background: var(--panel); border-left: 1px solid var(--border); overflow-y: auto;
    padding: 8px; display: flex; flex-direction: column; gap: 6px;
    transition: width 0.2s;
  }
  #app.sidebar-collapsed #sidebar { width: 0; overflow: hidden; padding: 0; border: none; }
  .side-panel { background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 4px; padding: 6px; }
  .side-panel h3 { font-size: 10px; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
  .side-panel canvas { display: block; width: 100%; }
  .side-legend { display: flex; flex-wrap: wrap; gap: 4px 8px; margin-top: 4px; }
  .side-legend span { font-size: 9px; color: var(--dim); display: flex; align-items: center; gap: 3px; }
  .side-legend i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }

  /* Bottom inference bar */
  #inference-bar {
    background: var(--panel); border-top: 1px solid var(--border); padding: 6px 12px;
    display: flex; align-items: center; gap: 16px; overflow-x: auto;
  }
  #app.inference-collapsed #inference-bar { height: 0; padding: 0; overflow: hidden; border: none; }
  #inference-canvas { flex-shrink: 0; }

  /* HUD overlay on game */
  #hud {
    position: absolute; top: 0; left: 0; right: 0; pointer-events: none;
    display: flex; justify-content: space-between; padding: 8px 12px;
  }
  .hud-box {
    background: rgba(10,10,26,0.75); border: 1px solid var(--border); border-radius: 4px;
    padding: 6px 10px; font-size: 11px; line-height: 1.5; backdrop-filter: blur(4px);
  }
  .hud-box .val { color: #fff; }
  .hud-box .lbl { color: var(--dim); }
  .state-badge {
    display: inline-block; padding: 2px 10px; border-radius: 3px;
    font-weight: bold; font-size: 12px; margin-left: 6px;
  }
  .state-CHASE { background: var(--red); color: #fff; }
  .state-IDLE { background: var(--blue); color: #fff; }
  .state-EVADE { background: var(--green); color: #000; }
  .state-DIE { background: #666; color: #fff; }

  /* Controls hint */
  #ctrl-hint {
    position: absolute; bottom: 8px; left: 12px; pointer-events: none;
    font-size: 10px; color: var(--dim); background: rgba(10,10,26,0.7);
    padding: 4px 8px; border-radius: 3px;
  }
  kbd { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 2px; padding: 0 3px; font-size: 10px; }

  /* Touch D-pad */
  #touch-pad {
    display: grid; position: fixed; bottom: 20px; left: 20px; z-index: 30;
    grid-template-columns: 48px 48px 48px; grid-template-rows: 48px 48px 48px;
    gap: 4px;
  }
  .touch-btn {
    width: 48px; height: 48px; border-radius: 10px; border: 2px solid rgba(110,198,255,0.3);
    background: rgba(19,19,42,0.85); color: var(--accent); font-size: 20px; font-weight: bold;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    user-select: none; -webkit-user-select: none; touch-action: manipulation;
  }
  .touch-btn:active { background: rgba(110,198,255,0.3); border-color: var(--accent); }
  #touch-w { grid-column: 2; grid-row: 1; }
  #touch-a { grid-column: 1; grid-row: 2; }
  #touch-s { grid-column: 2; grid-row: 3; }
  #touch-d { grid-column: 3; grid-row: 2; }

  /* Action buttons (mobile) */
  #touch-actions {
    display: flex; position: fixed; bottom: 24px; right: 20px; z-index: 30;
    gap: 8px;
  }
  .action-btn {
    width: 44px; height: 44px; border-radius: 8px; border: 2px solid rgba(110,198,255,0.3);
    background: rgba(19,19,42,0.85); color: var(--dim); font-size: 15px; font-weight: bold;
    font-family: inherit; cursor: pointer; user-select: none; touch-action: manipulation;
  }
  .action-btn:active { background: rgba(110,198,255,0.3); color: var(--accent); border-color: var(--accent); }
</style>
</head>
<body>

<div id="app">
  <!-- Game Canvas -->
  <div id="game-wrap">
    <canvas id="game"></canvas>
    <div id="hud">
      <div class="hud-box" id="hudLeft"></div>
      <div class="hud-box" id="hudRight"></div>
    </div>
    <div id="ctrl-hint"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> Move &nbsp; <kbd>1</kbd> Power↑Lv↑ &nbsp; <kbd>2</kbd> Power↓Lv↓ &nbsp; <kbd>3</kbd> HP− &nbsp; <kbd>4</kbd> HP+</div>
    <button class="toggle-btn" id="toggleSidebar">◀ Panels</button>
    <button class="toggle-btn" id="toggleInference">▲ Rules</button>
  </div>

  <!-- Touch D-pad (mobile) -->
  <div id="touch-pad">
    <div class="touch-btn" id="touch-w">W</div>
    <div class="touch-btn" id="touch-a">A</div>
    <div class="touch-btn" id="touch-s">S</div>
    <div class="touch-btn" id="touch-d">D</div>
  </div>
  <div id="touch-actions">
    <button class="action-btn" data-key="1">1</button>
    <button class="action-btn" data-key="2">2</button>
    <button class="action-btn" data-key="3">3</button>
    <button class="action-btn" data-key="4">4</button>
  </div>

  <!-- Right sidebar: membership graphs -->
  <div id="sidebar">
    <div class="side-panel">
      <h3>Range</h3>
      <canvas id="gRange" width="340" height="110"></canvas>
      <div class="side-legend" id="lRange"></div>
    </div>
    <div class="side-panel">
      <h3>Health</h3>
      <canvas id="gHealth" width="340" height="110"></canvas>
      <div class="side-legend" id="lHealth"></div>
    </div>
    <div class="side-panel">
      <h3>Rating</h3>
      <canvas id="gRating" width="340" height="110"></canvas>
      <div class="side-legend" id="lRating"></div>
    </div>
    <div class="side-panel" style="flex:1; min-height:80px;">
      <h3>Fuzzy Values</h3>
      <div id="liveValues" style="font-size:10px; line-height:1.7;"></div>
    </div>
  </div>

  <!-- Bottom: inference -->
  <div id="inference-bar">
    <canvas id="inference-canvas" width="1100" height="80"></canvas>
  </div>
</div>

<script>
// ========== FUZZY CORE ==========
const fl = {
  Grade: (v,x0,x1) => v<=x0?0:v>=x1?1:(v-x0)/(x1-x0),
  RGrade: (v,x0,x1) => v<=x0?1:v>=x1?0:(x1-v)/(x1-x0),
  Trap: (v,x0,x1,x2,x3) => v<=x0||v>=x3?0:v>=x1&&v<=x2?1:v>x0&&v<x1?(v-x0)/(x1-x0):(x3-v)/(x3-x2),
  AND: (a,b) => Math.min(a,b),
  NOT: (a) => 1-a
};

// ========== MEMBERSHIP DEFS ==========
const rangeDefs = [
  { n:'Melee', c:'#ff5555', fn: x => fl.RGrade(x, 0, 400) },
  { n:'Projectile', c:'#ffaa44', fn: x => fl.Trap(x, 80, 160, 320, 400) },
  { n:'OutOfRange', c:'#44aaff', fn: x => fl.Grade(x, 320, 400) }
];
const healthDefs = [
  { n:'NearDeath', c:'#ff2222', fn: x => fl.RGrade(x, 0, 40) },
  { n:'Critical', c:'#ff6622', fn: x => fl.Trap(x, 20, 40, 60, 80) },
  { n:'Serious', c:'#ffaa22', fn: x => fl.Trap(x, 60, 80, 100, 120) },
  { n:'Minor', c:'#44cc44', fn: x => fl.Trap(x, 100, 120, 140, 160) },
  { n:'Uninjured', c:'#22ffaa', fn: x => fl.Grade(x, 140, 160) }
];
const ratingDefs = [
  { n:'Wimp', c:'#7777ff', fn: x => fl.RGrade(x, 0, 20) },
  { n:'Easy', c:'#44cc44', fn: x => fl.Trap(x, 10, 20, 30, 40) },
  { n:'Moderate', c:'#ffaa22', fn: x => fl.Trap(x, 30, 40, 50, 60) },
  { n:'Hard', c:'#ff4444', fn: x => fl.Grade(x, 50, 60) }
];

// Build legends
function buildLegend(id, defs) {
  document.getElementById(id).innerHTML = defs.map(d =>
    `<span><i style="background:${d.c}"></i>${d.n}</span>`).join('');
}
buildLegend('lRange', rangeDefs);
buildLegend('lHealth', healthDefs);
buildLegend('lRating', ratingDefs);

// ========== SMALL GRAPH ==========
function drawSmallGraph(canvasId, defs, xMax, current) {
  const c = document.getElementById(canvasId);
  const ctx = c.getContext('2d');
  const W = c.width, H = c.height;
  const pL=28, pR=4, pT=4, pB=14;
  const gw=W-pL-pR, gh=H-pT-pB;
  ctx.clearRect(0,0,W,H);

  // Axes
  ctx.strokeStyle='#333'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(pL,pT); ctx.lineTo(pL,pT+gh); ctx.lineTo(pL+gw,pT+gh); ctx.stroke();

  // Y ticks
  ctx.fillStyle='#555'; ctx.font='8px monospace'; ctx.textAlign='right';
  [0,0.5,1].forEach(y => {
    const py = pT+gh-y*gh;
    ctx.fillText(y.toFixed(1), pL-3, py+3);
    if(y>0){ctx.strokeStyle='#1a1a2a';ctx.beginPath();ctx.moveTo(pL,py);ctx.lineTo(pL+gw,py);ctx.stroke();}
  });

  // Curves
  const steps=120;
  defs.forEach(d => {
    ctx.beginPath(); ctx.strokeStyle=d.c; ctx.lineWidth=1.5;
    for(let i=0;i<=steps;i++){
      const xv=(i/steps)*xMax, yv=d.fn(xv);
      const px=pL+(i/steps)*gw, py=pT+gh-yv*gh;
      i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
    }
    ctx.stroke();
    ctx.fillStyle=d.c+'12'; ctx.lineTo(pL+gw,pT+gh); ctx.lineTo(pL,pT+gh); ctx.closePath(); ctx.fill();
  });

  // Current value line + dots
  if(current!==null&&current!==undefined) {
    const cx=pL+(current/xMax)*gw;
    ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=1; ctx.setLineDash([3,2]);
    ctx.beginPath();ctx.moveTo(cx,pT);ctx.lineTo(cx,pT+gh);ctx.stroke();ctx.setLineDash([]);
    ctx.font='bold 9px monospace'; ctx.textAlign='center'; ctx.fillStyle='#fff';
    ctx.fillText(current.toFixed(0), cx, pT+gh+12);

    defs.forEach(d=>{
      const yv=d.fn(current), py=pT+gh-yv*gh;
      ctx.beginPath();ctx.arc(cx,py,3,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();
      ctx.strokeStyle=d.c;ctx.lineWidth=1.5;ctx.stroke();
    });
  }
}

// ========== INFERENCE BAR ==========
function drawInference(fd) {
  const c = document.getElementById('inference-canvas');
  const ctx = c.getContext('2d');
  const W=c.width, H=c.height;
  ctx.clearRect(0,0,W,H);

  const rules=[
    {n:'Attack',w:fd.dAtt,x:3,c:'#ff5555'},
    {n:'DoNothing',w:fd.dDn,x:1,c:'#44aaff'},
    {n:'Flee',w:fd.dFl,x:-3,c:'#44ff44'}
  ];

  const bw=120, bh=14, sx=100, gap=24;

  // Label
  ctx.fillStyle='#666';ctx.font='9px monospace';ctx.textAlign='left';
  ctx.fillText('RULE OUTPUT:', 10, 14);

  rules.forEach((r,i) => {
    const y = 22 + i * gap;
    // Name + coeff
    ctx.fillStyle=r.c; ctx.font='bold 10px monospace'; ctx.textAlign='left';
    ctx.fillText(r.n, 10, y+10);
    ctx.fillStyle='#555'; ctx.font='9px monospace';
    ctx.fillText(`×${r.x>0?'+':''}${r.x}`, 75, y+10);

    // Weight bar
    const barW = r.w * bw;
    ctx.fillStyle=r.c+'30'; ctx.fillRect(sx, y, bw, bh);
    ctx.fillStyle=r.c; ctx.globalAlpha=0.6;
    ctx.fillRect(sx, y, barW, bh);
    ctx.globalAlpha=1;

    // Weight val
    ctx.fillStyle='#ccc'; ctx.font='9px monospace'; ctx.textAlign='left';
    ctx.fillText(`μ=${r.w.toFixed(3)}`, sx+bw+6, y+10);
  });

  // Output
  const oy = 22 + 3*gap;
  ctx.fillStyle='#888'; ctx.font='9px monospace'; ctx.textAlign='left';
  ctx.fillText('OUTPUT:', 10, oy+2);

  const outColor = fd.output>1?'#ff5555':fd.output>0?'#44aaff':'#44ff44';
  const stateStr = fd.output>1?'CHASE':fd.output>0?'IDLE':'EVADE';

  // Number line
  const nlx=70, nlw=W-nlx-120, nly=oy-2;
  const minV=-3, maxV=3;
  const mapX=v=>nlx+((v-minV)/(maxV-minV))*nlw;

  ctx.strokeStyle='#444'; ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(nlx,nly+5);ctx.lineTo(nlx+nlw,nly+5);ctx.stroke();

  // Regions
  ctx.fillStyle='#44ff4410'; ctx.fillRect(mapX(-3),nly-2,mapX(0)-mapX(-3),14);
  ctx.fillStyle='#44aaff10'; ctx.fillRect(mapX(0),nly-2,mapX(1)-mapX(0),14);
  ctx.fillStyle='#ff555510'; ctx.fillRect(mapX(1),nly-2,mapX(3)-mapX(1),14);

  ctx.fillStyle='#555';ctx.font='7px monospace';ctx.textAlign='center';
  ctx.fillText('EVADE',mapX(-1.5),nly-3);ctx.fillText('IDLE',mapX(0.5),nly-3);ctx.fillText('CHASE',mapX(2),nly-3);

  for(let v=-3;v<=3;v++){
    const x=mapX(v);
    ctx.fillStyle='#333';ctx.fillRect(x,nly+2,1,6);
    ctx.fillStyle='#666';ctx.font='7px monospace';ctx.fillText(v,x,nly+14);
  }

  // Marker
  const mx=mapX(Math.max(minV,Math.min(maxV,fd.output)));
  ctx.fillStyle=outColor;
  ctx.beginPath();ctx.moveTo(mx,nly-1);ctx.lineTo(mx-4,nly-8);ctx.lineTo(mx+4,nly-8);ctx.closePath();ctx.fill();

  // Output value
  ctx.fillStyle=outColor;ctx.font='bold 11px monospace';ctx.textAlign='left';
  ctx.fillText(`= ${fd.output.toFixed(4)}`, W-110, oy+2);
  ctx.fillStyle='#fff';ctx.font='bold 10px monospace';
  ctx.fillText(`→ ${stateStr}`, W-110, oy+16);
}

// ========== GAME STATE ==========
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  const wrap = document.getElementById('game-wrap');
  W = wrap.clientWidth;
  H = wrap.clientHeight;
  canvas.width = W;
  canvas.height = H;
}
resize();
window.addEventListener('resize', resize);
// Auto-collapse sidebar on mobile, then resize
if(window.innerWidth <= 768) {
  document.getElementById('app').classList.add('sidebar-collapsed');
  requestAnimationFrame(resize);
}

// Entities
let player = { x: Math.random()*800+50, y: Math.random()*500+50 };
const playerSpd = { x: 6, y: 6 };
let powerUp = false;

const mon = {
  x: Math.random()*800+50, y: Math.random()*500+50,
  spd: { x:1, y:1 }, dist: 0, state: 0, showState: 'IDLE',
  hp: 160, level: 1, output: 0, oldState: 0,
  patrolIdx: 0,
  patterns: [{x:50,y:0},{x:50,y:-50},{x:0,y:-50},{x:0,y:0}],
  offsets: []
};
mon.offsets = mon.patterns.map(p=>({x:mon.x+p.x, y:mon.y+p.y}));

let fd = { dMelee:0, dOR:0, dUn:0, dHard:0, dAtt:0, dDn:0, dFl:0, output:0 };

// Input
const keys={};
document.addEventListener('keydown',e=>{
  if(['1','2','3','4','w','a','s','d','W','A','S','D'].includes(e.key))e.preventDefault();
  if(['1','2','3','4'].includes(e.key)&&!keys[e.key])handleKey(e.key);
  keys[e.key]=true;
});
document.addEventListener('keyup',e=>{keys[e.key]=false;});

// Touch D-pad handlers
const touchMap = {'touch-w':'w','touch-a':'a','touch-s':'s','touch-d':'d'};
Object.entries(touchMap).forEach(([id,key]) => {
  const el = document.getElementById(id);
  el.addEventListener('touchstart', e=>{e.preventDefault();keys[key]=true;},{passive:false});
  el.addEventListener('touchend', e=>{e.preventDefault();keys[key]=false;},{passive:false});
  el.addEventListener('touchcancel', e=>{keys[key]=false;});
});
// Action buttons (1-4)
document.querySelectorAll('.action-btn').forEach(btn => {
  btn.addEventListener('touchstart', e=>{e.preventDefault();handleKey(btn.dataset.key);},{passive:false});
  btn.addEventListener('click', e=>{handleKey(btn.dataset.key);});
});

function handleKey(k){
  if(k==='1'){powerUp=!powerUp;mon.level++;}
  else if(k==='2'){powerUp=!powerUp;mon.level--;}
  else if(k==='3'){mon.hp--;}
  else if(k==='4'){mon.hp++;}
}

// Toggle buttons
document.getElementById('toggleSidebar').addEventListener('click',()=>{
  document.getElementById('app').classList.toggle('sidebar-collapsed');
  setTimeout(resize,250);
});
document.getElementById('toggleInference').addEventListener('click',()=>{
  document.getElementById('app').classList.toggle('inference-collapsed');
  setTimeout(resize,250);
});

// ========== MONSTER LOGIC ==========
function moveToward(pos,tgt,spd){
  ['x','y'].forEach(a=>{
    const d=Math.abs(pos[a]-tgt[a]);
    if(d>=spd[a]) pos[a]+=pos[a]<tgt[a]?spd[a]:-spd[a];
    else pos[a]=tgt[a];
  });
}

function monsterUpdate(){
  const dx=player.x-mon.x, dy=player.y-mon.y;
  mon.dist=Math.sqrt(dx*dx+dy*dy);

  // Die check
  if(mon.x<-20||mon.x>W+20||mon.y<-20||mon.y>H+20){
    mon.state=3; mon.showState='DIE';
    respawn(); return;
  }

  // Fuzzy inference
  const dm=fl.RGrade(mon.dist,0,400);
  const du=fl.Grade(mon.hp,140,160);
  const dh=fl.Grade(mon.level,50,60);
  const dor=fl.Grade(mon.dist,320,400);
  const dAtt=fl.AND(fl.AND(dm,du),fl.NOT(dh));
  const dDn=fl.AND(fl.NOT(dm),du);
  const dFl=fl.AND(fl.NOT(dor),fl.NOT(du));

  let den=dFl+dDn+dAtt; if(den===0)den=0.001;
  const out=(-3*dFl+1*dDn+3*dAtt)/den;
  mon.output=out;
  fd={dMelee:dm,dOR:dor,dUn:du,dHard:dh,dAtt,dDn,dFl,output:out};

  if(out>1){
    mon.state=1;mon.showState='CHASE';mon.spd={x:out*0.5,y:out*0.5};
  }else if(out>0){
    if(mon.oldState!==0){
      mon.state=0;mon.showState='IDLE';mon.patrolIdx=0;
      mon.offsets=mon.patterns.map(p=>({x:Math.round(mon.x+p.x),y:Math.round(mon.y+p.y)}));
      mon.spd={x:1,y:1};
    }
  }else{
    mon.state=2;mon.showState='EVADE';mon.spd={x:-1*out*0.5,y:-1*out*0.5};
  }
  mon.oldState=mon.state;

  if(mon.state===0)patrol();
  else if(mon.state===1)moveToward(mon,player,mon.spd);
  else if(mon.state===2){
    const away={x:2*mon.x-player.x,y:2*mon.y-player.y};
    moveToward(mon,away,mon.spd);
  }
}

function patrol(){
  const pi=mon.patrolIdx;
  if(pi<mon.patterns.length){
    const t=mon.offsets[pi];
    if(mon.x!==t.x||mon.y!==t.y) moveToward(mon,t,mon.spd);
    else mon.patrolIdx++;
  }else mon.patrolIdx=0;
}

function respawn(){
  mon.x=Math.random()*W;mon.y=Math.random()*H;
  mon.state=0;mon.showState='IDLE';mon.patrolIdx=0;
  mon.offsets=mon.patterns.map(p=>({x:mon.x+p.x,y:mon.y+p.y}));
}

// ========== RENDER ==========
const stateCol={IDLE:'#44aaff',CHASE:'#ff5555',EVADE:'#44ff46',DIE:'#888'};

function drawGame(){
  ctx.clearRect(0,0,W,H);

  // Grid
  ctx.strokeStyle='#151530';ctx.lineWidth=1;
  for(let x=0;x<W;x+=64){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=64){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

  // Detection range
  ctx.beginPath();ctx.arc(mon.x,mon.y,400,0,Math.PI*2);
  ctx.strokeStyle='rgba(255,255,100,0.06)';ctx.lineWidth=1;ctx.stroke();

  // Line to player
  ctx.beginPath();ctx.moveTo(mon.x,mon.y);ctx.lineTo(player.x,player.y);
  ctx.strokeStyle='rgba(255,255,100,0.2)';ctx.setLineDash([5,5]);ctx.stroke();ctx.setLineDash([]);

  // Player mouse
  ctx.save();ctx.translate(player.x,player.y);
  ctx.fillStyle=powerUp?'#ff6666':'#ccc';
  ctx.beginPath();ctx.arc(0,0,14,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#555';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle=powerUp?'#ff8888':'#ddd';
  ctx.beginPath();ctx.arc(-7,-13,6,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(7,-13,6,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#222';
  ctx.beginPath();ctx.arc(-4,-2,2.5,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(4,-2,2.5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#ff9999';ctx.beginPath();ctx.arc(0,2,2,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#888';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(0,14);ctx.bezierCurveTo(18,18,18,28,10,32);ctx.stroke();
  ctx.restore();
  if(powerUp){
    ctx.beginPath();ctx.arc(player.x,player.y,20,0,Math.PI*2);
    ctx.strokeStyle='rgba(255,80,80,0.35)';ctx.lineWidth=2;ctx.stroke();
  }

  // Monster cat
  const sc=stateCol[mon.showState]||'#fff';
  ctx.save();ctx.translate(mon.x,mon.y);
  // Glow for chase
  if(mon.showState==='CHASE'){
    ctx.beginPath();ctx.arc(0,0,22,0,Math.PI*2);
    ctx.strokeStyle='rgba(255,80,80,0.25)';ctx.lineWidth=2;ctx.stroke();
  }
  ctx.fillStyle=sc;ctx.beginPath();ctx.arc(0,0,16,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle=sc;
  ctx.beginPath();ctx.moveTo(-11,-9);ctx.lineTo(-14,-23);ctx.lineTo(-3,-13);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(11,-9);ctx.lineTo(14,-23);ctx.lineTo(3,-13);ctx.closePath();ctx.fill();
  ctx.fillStyle='#111';
  ctx.beginPath();ctx.arc(-4,-2,2.5,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(4,-2,2.5,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(-16,0);ctx.lineTo(-6,2);ctx.stroke();
  ctx.beginPath();ctx.moveTo(-16,4);ctx.lineTo(-6,3);ctx.stroke();
  ctx.beginPath();ctx.moveTo(16,0);ctx.lineTo(6,2);ctx.stroke();
  ctx.beginPath();ctx.moveTo(16,4);ctx.lineTo(6,3);ctx.stroke();
  ctx.restore();

  // HUD
  const hL=document.getElementById('hudLeft');
  hL.innerHTML=`<span class="lbl">Player</span> <span class="val">(${Math.round(player.x)},${Math.round(player.y)})</span> <span class="lbl">Power</span> <span class="val">${powerUp?'ON':'OFF'}</span><br>`+
    `<span class="lbl">Monster</span> <span class="val">(${Math.round(mon.x)},${Math.round(mon.y)})</span> <span class="lbl">Dist</span> <span class="val">${mon.dist.toFixed(1)}</span>`;

  const hR=document.getElementById('hudRight');
  hR.innerHTML=`<span class="lbl">HP</span> <span class="val">${mon.hp}</span> <span class="lbl">Lv</span> <span class="val">${mon.level}</span> <span class="lbl">FL</span> <span class="val">${mon.output.toFixed(4)}</span> <span class="state-badge state-${mon.showState}">${mon.showState}</span>${moving?'<span style="color:#4f4;margin-left:6px">●MOVE</span>':''}`;
}

function drawLiveValues(){
  const el=document.getElementById('liveValues');
  el.innerHTML=[
    `<span style="color:#ff5555">μ Melee</span> ${fd.dMelee.toFixed(3)}`,
    `<span style="color:#44aaff">μ OOR</span> ${fd.dOR.toFixed(3)}`,
    `<span style="color:#22ffaa">μ Uninj</span> ${fd.dUn.toFixed(3)}`,
    `<span style="color:#ff4444">μ Hard</span> ${fd.dHard.toFixed(3)}`,
    `<span style="color:#ff5555">μ Attack</span> ${fd.dAtt.toFixed(3)}`,
    `<span style="color:#44aaff">μ DoNothing</span> ${fd.dDn.toFixed(3)}`,
    `<span style="color:#44ff44">μ Flee</span> ${fd.dFl.toFixed(3)}`,
    `<span style="color:#fff;font-weight:bold">Output</span> <span style="color:${stateCol[mon.showState]||'#fff'}">${fd.output.toFixed(4)}</span>`
  ].join('<br>');
}

// ========== MAIN LOOP ==========
function loop(){
  // Player movement
  const moving = keys['a']||keys['A']||keys['d']||keys['D']||keys['w']||keys['W']||keys['s']||keys['S'];
  if(keys['a']||keys['A'])player.x-=playerSpd.x;
  if(keys['d']||keys['D'])player.x+=playerSpd.x;
  if(keys['w']||keys['W'])player.y-=playerSpd.y;
  if(keys['s']||keys['S'])player.y+=playerSpd.y;

  monsterUpdate();

  if(player.x<-10||player.x>W+10||player.y<-10||player.y>H+10)
    player={x:Math.random()*W,y:Math.random()*H};

  drawGame();
  drawSmallGraph('gRange',rangeDefs,400,mon.dist);
  drawSmallGraph('gHealth',healthDefs,160,mon.hp);
  drawSmallGraph('gRating',ratingDefs,60,mon.level);
  drawInference(fd);
  drawLiveValues();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
