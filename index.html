<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fuzzy Logic Sugeno - AI Monster</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: 'Segoe UI', Arial, sans-serif; color: #e0e0e0; }
  h1 { margin-bottom: 8px; font-size: 22px; color: #7ec8e3; }
  #game { border: 2px solid #4a4a6a; display: block; background: #2a2a4a; }
  #controls { margin-top: 12px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
  .ctrl-group { background: #2a2a4a; border: 1px solid #4a4a6a; border-radius: 6px; padding: 8px 14px; text-align: center; }
  .ctrl-group .label { font-size: 11px; color: #8888aa; margin-bottom: 4px; }
  .ctrl-group .keys { font-size: 13px; color: #b0b0d0; }
  kbd { background: #3a3a5a; border: 1px solid #5a5a7a; border-radius: 3px; padding: 1px 5px; font-size: 12px; color: #ccccee; }
</style>
</head>
<body>
<h1>Fuzzy Logic Sugeno — AI Monster Behavior</h1>
<canvas id="game" width="1024" height="768"></canvas>
<div id="controls">
  <div class="ctrl-group"><div class="label">Movement</div><div class="keys"><kbd>←</kbd> <kbd>→</kbd> <kbd>↑</kbd> <kbd>↓</kbd></div></div>
  <div class="ctrl-group"><div class="label">Power Up + Level ↑</div><div class="keys"><kbd>1</kbd></div></div>
  <div class="ctrl-group"><div class="label">Power Down + Level ↓</div><div class="keys"><kbd>2</kbd></div></div>
  <div class="ctrl-group"><div class="label">Monster HP −1</div><div class="keys"><kbd>3</kbd></div></div>
  <div class="ctrl-group"><div class="label">Monster HP +1</div><div class="keys"><kbd>4</kbd></div></div>
</div>

<script>
// === FuzzyLogic.js ===
class FuzzyLogic {
  FuzzyGrade(value, x0, x1) {
    if (value <= x0) return 0;
    if (value >= x1) return 1;
    return (value / (x1 - x0)) - (x0 / (x1 - x0));
  }
  FuzzyReverseGrade(value, x0, x1) {
    if (value <= x0) return 1;
    if (value >= x1) return 0;
    return (-value / (x1 - x0)) + (x1 / (x1 - x0));
  }
  FuzzyTriangle(value, x0, x1, x2) {
    if (value <= x0) return 0;
    if (value === x1) return 1;
    if (value > x0 && value < x1) return (value / (x1 - x0)) - (x0 / (x1 - x0));
    return (-value / (x2 - x1)) + (x2 / (x2 - x1));
  }
  FuzzyTrapezoid(value, x0, x1, x2, x3) {
    if (value <= x0) return 0;
    if (value >= x1 && value <= x2) return 1;
    if (value > x0 && value < x1) return (value / (x1 - x0)) - (x0 / (x1 - x0));
    return (-value / (x3 - x2)) + (x3 / (x3 - x2));
  }
  FuzzyAND(A, B) { return Math.min(A, B); }
  FuzzyOR(A, B) { return Math.max(A, B); }
  FuzzyNOT(A) { return 1.0 - A; }
}

// === RangeMemberShip.js ===
class RangeMemberShip {
  constructor() {
    this.fl = new FuzzyLogic();
    this.x0 = 80; this.x1 = 160; this.x2 = 320; this.x3 = 400;
  }
  calMeberShipValueMelee(x) { return this.fl.FuzzyReverseGrade(x, 0, this.x3); }
  calMeberShipValueProjectile(x) { return this.fl.FuzzyTrapezoid(x, this.x0, this.x1, this.x2, this.x3); }
  calMeberShipValueOutofRange(x) { return this.fl.FuzzyGrade(x, this.x2, this.x3); }
}

// === HealthMemberShip.js ===
class HealthMemberShip {
  constructor() {
    this.fl = new FuzzyLogic();
    this.x0=20; this.x1=40; this.x2=60; this.x3=80;
    this.x4=100; this.x5=120; this.x6=140; this.x7=160;
  }
  calMeberShipValueNearDeath(x) { return this.fl.FuzzyReverseGrade(x, 0, this.x1); }
  calMeberShipValueCritical(x) { return this.fl.FuzzyTrapezoid(x, this.x0, this.x1, this.x2, this.x3); }
  calMeberShipValueSerious(x) { return this.fl.FuzzyTrapezoid(x, this.x2, this.x3, this.x4, this.x5); }
  calMeberShipValueMinor(x) { return this.fl.FuzzyTrapezoid(x, this.x4, this.x5, this.x6, this.x7); }
  calMeberShipValueUninjured(x) { return this.fl.FuzzyGrade(x, this.x6, this.x7); }
}

// === RatingMemberShip.js ===
class RatingMemberShip {
  constructor() {
    this.fl = new FuzzyLogic();
    this.x0=10; this.x1=20; this.x2=30; this.x3=40; this.x4=50; this.x5=60;
  }
  calMeberShipValueWimp(x) { return this.fl.FuzzyReverseGrade(x, 0, this.x1); }
  calMeberShipValueEasy(x) { return this.fl.FuzzyTrapezoid(x, this.x0, this.x1, this.x2, this.x3); }
  calMeberShipValueModerate(x) { return this.fl.FuzzyTrapezoid(x, this.x2, this.x3, this.x4, this.x5); }
  calMeberShipValueHard(x) { return this.fl.FuzzyGrade(x, this.x4, this.x5); }
}

// === Monster.js ===
const IDLE = 0, CHASE = 1, EVADE = 2, INTERCEPT = 3, DIE = 4;

class Monster {
  constructor(in_position, in_speed, vpW, vpH) {
    this.state = IDLE;
    this.position = { x: in_position.x, y: in_position.y };
    this.speed = { x: in_speed.x, y: in_speed.y };
    this.Rotation = 0;
    this.detected_distance = 0;
    this.vpW = vpW;
    this.vpH = vpH;

    this.patterns = [
      { x: 50, y: 0 },
      { x: 50, y: -50 },
      { x: 0, y: -50 },
      { x: 0, y: 0 }
    ];
    this.Offset_patterns = this.patterns.map(p => ({ x: this.position.x + p.x, y: this.position.y + p.y }));
    this.patrol_index = 0;
    this.show_state = "IDLE";

    this.player_position = { x: 0, y: 0 };
    this.player_speed = { x: 0, y: 0 };
    this.player_power_up = false;

    this.fl = new FuzzyLogic();
    this.rangemembership = new RangeMemberShip();
    this.healthmebership = new HealthMemberShip();
    this.ratingmembership = new RatingMemberShip();
    this.HP = 160;
    this.Level = 1;
    this.old_state = 0;
    this.output = 0;
    this.old_position = { x: 0, y: 0 };
  }

  Update(in_player_position, in_player_speed, in_player_power_up) {
    this.player_position = in_player_position;
    this.player_speed = in_player_speed;
    this.player_power_up = in_player_power_up;
    this.Transition();
    if (this.state === IDLE) {
      this.Patrol();
    } else if (this.state === CHASE) {
      this.basicChasing();
    } else if (this.state === EVADE) {
      this.basicEvading();
    } else if (this.state === DIE) {
      this.Respawn();
    }
    this.old_position = { x: this.position.x, y: this.position.y };
  }

  Transition() {
    let temp = { x: this.player_position.x - this.position.x, y: this.player_position.y - this.position.y };
    let temp2 = Math.sqrt(temp.x * temp.x + temp.y * temp.y);
    this.detected_distance = temp2;

    if (this.position.x < 0 || this.position.x > this.vpW) this.state = DIE;
    if (this.position.y < 0 || this.position.y > this.vpH) this.state = DIE;

    let degreeMelee = this.rangemembership.calMeberShipValueMelee(temp2);
    let degreeUninjured = this.healthmebership.calMeberShipValueUninjured(this.HP);
    let degreeHard = this.ratingmembership.calMeberShipValueHard(this.Level);
    let degreeAttack = this.fl.FuzzyAND(this.fl.FuzzyAND(degreeMelee, degreeUninjured), this.fl.FuzzyNOT(degreeHard));

    let degreeDoNothing = this.fl.FuzzyAND(this.fl.FuzzyNOT(degreeMelee), degreeUninjured);

    let degreeOutOfRange = this.rangemembership.calMeberShipValueOutofRange(temp2);
    let degreeFlee = this.fl.FuzzyAND(this.fl.FuzzyNOT(degreeOutOfRange), this.fl.FuzzyNOT(degreeUninjured));

    let denom = degreeFlee + degreeDoNothing + degreeAttack;
    if (denom === 0) denom = 0.001;
    this.output = (-3 * degreeFlee + 1 * degreeDoNothing + 3 * degreeAttack) / denom;

    if (this.output > 1) {
      this.state = CHASE;
      this.speed = { x: this.output, y: this.output };
      this.show_state = "CHASE";
    } else if (this.output <= 1 && this.output > 0) {
      this.show_state = "IDLE";
      if (this.old_state !== IDLE) {
        this.state = IDLE;
        this.patrol_index = 0;
        for (let i = 0; i < this.patterns.length; i++) {
          this.Offset_patterns[i].x = Math.round(this.position.x + this.patterns[i].x);
          this.Offset_patterns[i].y = Math.round(this.position.y + this.patterns[i].y);
        }
        this.speed = { x: 1, y: 1 };
      }
    } else {
      this.show_state = "EVADE";
      this.state = EVADE;
      this.speed = { x: -1 * this.output, y: -1 * this.output };
    }
    this.old_state = this.state;
  }

  Patrol() {
    if (this.patrol_index < this.patterns.length) {
      if (this.position.x !== this.Offset_patterns[this.patrol_index].x || this.position.y !== this.Offset_patterns[this.patrol_index].y) {
        // X movement
        if (this.position.x > this.Offset_patterns[this.patrol_index].x) {
          if (Math.abs(this.position.x - this.Offset_patterns[this.patrol_index].x) >= this.speed.x)
            this.position.x -= this.speed.x;
          else
            this.position.x -= Math.abs(this.position.x - this.Offset_patterns[this.patrol_index].x);
        } else if (this.position.x < this.Offset_patterns[this.patrol_index].x) {
          if (Math.abs(this.position.x - this.Offset_patterns[this.patrol_index].x) >= this.speed.x)
            this.position.x += this.speed.x;
          else
            this.position.x += Math.abs(this.position.x - this.Offset_patterns[this.patrol_index].x);
        }
        // Y movement
        if (this.position.y > this.Offset_patterns[this.patrol_index].y) {
          if (Math.abs(this.position.y - this.Offset_patterns[this.patrol_index].y) >= this.speed.y)
            this.position.y -= this.speed.y;
          else
            this.position.y -= Math.abs(this.position.y - this.Offset_patterns[this.patrol_index].y);
        } else if (this.position.y < this.Offset_patterns[this.patrol_index].y) {
          if (Math.abs(this.position.y - this.Offset_patterns[this.patrol_index].y) >= this.speed.y)
            this.position.y += this.speed.y;
          else
            this.position.y += Math.abs(this.position.y - this.Offset_patterns[this.patrol_index].y);
        }
      } else {
        this.patrol_index++;
      }
    } else {
      this.patrol_index = 0;
    }
  }

  basicChasing() {
    if (this.position.x > this.player_position.x) {
      if (Math.abs(this.position.x - this.player_position.x) >= this.speed.x)
        this.position.x -= this.speed.x;
      else
        this.position.x -= Math.abs(this.position.x - this.player_position.x);
    } else if (this.position.x < this.player_position.x) {
      if (Math.abs(this.position.x - this.player_position.x) >= this.speed.x)
        this.position.x += this.speed.x;
      else
        this.position.x += Math.abs(this.position.x - this.player_position.x);
    }
    if (this.position.y > this.player_position.y) {
      if (Math.abs(this.position.y - this.player_position.y) >= this.speed.y)
        this.position.y -= this.speed.y;
      else
        this.position.y -= Math.abs(this.position.y - this.player_position.y);
    } else if (this.position.y < this.player_position.y) {
      if (Math.abs(this.position.y - this.player_position.y) >= this.speed.y)
        this.position.y += this.speed.y;
      else
        this.position.y += Math.abs(this.position.y - this.player_position.y);
    }
  }

  basicEvading() {
    if (this.position.x > this.player_position.x) {
      if (Math.abs(this.position.x - this.player_position.x) >= this.speed.x)
        this.position.x += this.speed.x;
      else
        this.position.x += Math.abs(this.position.x - this.player_position.x);
    } else if (this.position.x < this.player_position.x) {
      if (Math.abs(this.position.x - this.player_position.x) >= this.speed.x)
        this.position.x -= this.speed.x;
      else
        this.position.x -= Math.abs(this.position.x - this.player_position.x);
    }
    if (this.position.y > this.player_position.y) {
      if (Math.abs(this.position.y - this.player_position.y) >= this.speed.y)
        this.position.y += this.speed.y;
      else
        this.position.y += Math.abs(this.position.y - this.player_position.y);
    } else if (this.position.y < this.player_position.y) {
      if (Math.abs(this.position.y - this.player_position.y) >= this.speed.y)
        this.position.y -= this.speed.y;
      else
        this.position.y -= Math.abs(this.position.y - this.player_position.y);
    }
  }

  Respawn() {
    this.position.x = Math.random() * this.vpW;
    this.position.y = Math.random() * this.vpH;
    this.state = IDLE;
    this.show_state = "IDLE";
    this.patrol_index = 0;
    for (let i = 0; i < this.patterns.length; i++) {
      this.Offset_patterns[i] = { x: this.position.x + this.patterns[i].x, y: this.position.y + this.patterns[i].y };
    }
  }
}

// === Game1.js ===
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 1024, H = 768;

let player_Position = { x: Math.random() * W, y: Math.random() * H };
let player_Speed = { x: 6, y: 6 };
let player_power_up = false;
let monster_Speed = { x: 1, y: 1 };
let monster_Position = { x: Math.random() * W, y: Math.random() * H };
let myMonster = new Monster(monster_Position, monster_Speed, W, H);

const keys = {};
const keyDown = {};

document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (!keyDown[e.key]) {
    keyDown[e.key] = true;
    handleKeyPress(e.key);
  }
  e.preventDefault();
});
document.addEventListener('keyup', e => {
  keys[e.key] = false;
  keyDown[e.key] = false;
  e.preventDefault();
});

function handleKeyPress(key) {
  if (key === '1') {
    player_power_up = !player_power_up;
    myMonster.Level++;
  } else if (key === '2') {
    player_power_up = !player_power_up;
    myMonster.Level--;
  } else if (key === '3') {
    myMonster.HP -= 1;
  } else if (key === '4') {
    myMonster.HP += 1;
  }
}

function update() {
  // Player movement
  if (keys['ArrowLeft'])  player_Position.x -= player_Speed.x;
  if (keys['ArrowRight']) player_Position.x += player_Speed.x;
  if (keys['ArrowUp'])    player_Position.y -= player_Speed.y;
  if (keys['ArrowDown'])  player_Position.y += player_Speed.y;

  myMonster.Update(player_Position, player_Speed, player_power_up);

  // Wrap player
  if (player_Position.x < 0 || player_Position.x > W)
    player_Position = { x: Math.random() * W, y: Math.random() * H };
  if (player_Position.y < 0 || player_Position.y > H)
    player_Position = { x: Math.random() * W, y: Math.random() * H };
}

// State color mapping
const stateColors = {
  IDLE: '#44aaff',
  CHASE: '#ff4444',
  EVADE: '#44ff44',
  DIE: '#888888'
};

function draw() {
  ctx.clearRect(0, 0, W, H);

  // Grid lines
  ctx.strokeStyle = '#333355';
  ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 64) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = 0; y < H; y += 64) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }

  // Detection range circle
  ctx.beginPath();
  ctx.arc(myMonster.position.x, myMonster.position.y, 400, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(255,255,100,0.15)';
  ctx.lineWidth = 1;
  ctx.stroke();

  // Detection line
  ctx.beginPath();
  ctx.moveTo(myMonster.position.x, myMonster.position.y);
  ctx.lineTo(player_Position.x, player_Position.y);
  ctx.strokeStyle = 'rgba(255,255,100,0.3)';
  ctx.setLineDash([5, 5]);
  ctx.stroke();
  ctx.setLineDash([]);

  // Player (mouse) 🐭
  ctx.save();
  ctx.translate(player_Position.x, player_Position.y);
  // Body
  ctx.fillStyle = player_power_up ? '#ff6666' : '#cccccc';
  ctx.beginPath();
  ctx.arc(0, 0, 14, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#666';
  ctx.lineWidth = 2;
  ctx.stroke();
  // Ears
  ctx.fillStyle = player_power_up ? '#ff8888' : '#dddddd';
  ctx.beginPath(); ctx.arc(-8, -14, 6, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(8, -14, 6, 0, Math.PI * 2); ctx.fill();
  // Eyes
  ctx.fillStyle = '#333';
  ctx.beginPath(); ctx.arc(-4, -2, 2, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(4, -2, 2, 0, Math.PI * 2); ctx.fill();
  // Nose
  ctx.fillStyle = '#ff9999';
  ctx.beginPath(); ctx.arc(0, 2, 2, 0, Math.PI * 2); ctx.fill();
  // Tail
  ctx.strokeStyle = '#999';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, 14);
  ctx.bezierCurveTo(20, 20, 20, 30, 10, 35);
  ctx.stroke();
  ctx.restore();

  // Power-up glow
  if (player_power_up) {
    ctx.beginPath();
    ctx.arc(player_Position.x, player_Position.y, 22, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,100,100,0.5)';
    ctx.lineWidth = 3;
    ctx.stroke();
  }

  // Monster (cat) 🐱
  let stateCol = stateColors[myMonster.show_state] || '#ffffff';
  ctx.save();
  ctx.translate(myMonster.position.x, myMonster.position.y);
  // Body
  ctx.fillStyle = stateCol;
  ctx.beginPath();
  ctx.arc(0, 0, 16, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.stroke();
  // Ears (triangles)
  ctx.fillStyle = stateCol;
  ctx.beginPath(); ctx.moveTo(-12, -10); ctx.lineTo(-16, -24); ctx.lineTo(-4, -14); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(12, -10); ctx.lineTo(16, -24); ctx.lineTo(4, -14); ctx.closePath(); ctx.fill();
  // Eyes
  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.arc(-5, -3, 2.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(5, -3, 2.5, 0, Math.PI * 2); ctx.fill();
  // Whiskers
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(-16, 0); ctx.lineTo(-6, 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-16, 4); ctx.lineTo(-6, 4); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(16, 0); ctx.lineTo(6, 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(16, 4); ctx.lineTo(6, 4); ctx.stroke();
  ctx.restore();

  // HUD
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(10, 10, 380, 100);
  ctx.strokeStyle = '#4a4a6a';
  ctx.strokeRect(10, 10, 380, 100);

  ctx.fillStyle = '#ffffff';
  ctx.font = '13px monospace';
  ctx.fillText('Player Pos: (' + Math.round(player_Position.x) + ', ' + Math.round(player_Position.y) + ')  Speed: ' + player_Speed.x + '  Power: ' + player_power_up, 18, 30);
  ctx.fillText('Monster Pos: (' + Math.round(myMonster.position.x) + ', ' + Math.round(myMonster.position.y) + ')  Speed: ' + myMonster.speed.x.toFixed(2), 18, 50);
  ctx.fillText('Detection Dist: ' + myMonster.detected_distance.toFixed(1) + '  FL Output: ' + myMonster.output.toFixed(4), 18, 70);
  ctx.fillText('Level: ' + myMonster.Level + '  HP: ' + myMonster.HP + '  State: ' + myMonster.show_state, 18, 90);

  // State indicator
  ctx.fillStyle = stateColors[myMonster.show_state] || '#fff';
  ctx.fillRect(W - 160, 10, 150, 26);
  ctx.fillStyle = '#000';
  ctx.font = 'bold 14px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('State: ' + myMonster.show_state, W - 85, 28);
  ctx.textAlign = 'left';

  // Legend
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(W - 160, 44, 150, 76);
  const legend = [
    ['CHASE', '#ff4444', 'output > 1'],
    ['IDLE',  '#44aaff', '0 < output ≤ 1'],
    ['EVADE', '#44ff44', 'output ≤ 0'],
    ['DIE',   '#888888', 'out of bounds']
  ];
  ctx.font = '11px monospace';
  legend.forEach((l, i) => {
    ctx.fillStyle = l[1];
    ctx.fillRect(W - 155, 52 + i * 17, 10, 10);
    ctx.fillStyle = '#ccc';
    ctx.fillText(l[0] + '  ' + l[2], W - 140, 62 + i * 17);
  });
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
